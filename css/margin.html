<!DOCTYPE html>
<html>
    <head>
        <style>
            div{
                border:1px solid rgb(245, 110, 110);
                margin-top:150px;
                margin-bottom:150px;
                margin-right:150px;
                margin-left:150px;
                background-color:rgb(248, 175, 255);
            width :300px;
            margin: auto;
            border:1px solid red;
            }
        </style>
    </head>
</html>
<body>
    <h2>Using individual margin properties</h2>
    <div>this div element has a top margin of 100px, a right margin of 150px ,a 
        bottom margin of 100px,and a left margin of 80px.</div>

    </div>
